<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/greenwood-leaf-gold.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenwood Café &amp; Restaurant — 100% Pure Veg Fine Dine, Narela, Delhi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    <style>
      @keyframes gold-ring-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes emblem-float-breath {
        0%, 100% {
          transform: translateY(0px) scale(1);
          filter: drop-shadow(0 8px 16px rgba(150, 105, 30, 0.35));
        }
        50% {
          transform: translateY(-3px) scale(1.02);
          filter: drop-shadow(0 12px 22px rgba(150, 105, 30, 0.45));
        }
      }
      @keyframes gold-shine-sweep {
        0% { transform: translateX(-150%) skewX(-20deg); opacity: 0; }
        15% { opacity: 1; }
        65% { transform: translateX(320%) skewX(-20deg); opacity: 1; }
        70%, 100% { transform: translateX(320%) skewX(-20deg); opacity: 0; }
      }
      @keyframes star-sparkle-burst {
        0%, 35% { transform: scale(0) rotate(0deg); opacity: 0; }
        50% { transform: scale(1.3) rotate(45deg); opacity: 1; }
        65% { transform: scale(0) rotate(90deg); opacity: 0; }
        100% { transform: scale(0) rotate(90deg); opacity: 0; }
      }
      .init-loader-stage {
        position: relative;
        width: 126px;
        height: 126px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .init-orbit-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px solid rgba(201, 164, 92, 0.18);
        border-top: 2px solid #C9A45C;
        border-right: 1.5px solid rgba(201, 164, 92, 0.65);
        animation: gold-ring-spin 1.5s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
        pointer-events: none;
      }
      .init-orbit-jewel {
        position: absolute;
        top: -3px;
        left: calc(50% - 3px);
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #FFF5D1;
        box-shadow: 0 0 6px #C9A45C, 0 0 10px #FFD700;
      }
      .init-emblem-wrapper {
        position: relative;
        width: 82px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: emblem-float-breath 2.6s ease-in-out infinite;
        user-select: none;
      }
      .init-shine-mask {
        position: absolute;
        inset: 0;
        mask-image: url('/greenwood-3d-gold-logo.png');
        -webkit-mask-image: url('/greenwood-3d-gold-logo.png');
        mask-size: contain;
        -webkit-mask-size: contain;
        mask-repeat: no-repeat;
        -webkit-mask-repeat: no-repeat;
        mask-position: center;
        -webkit-mask-position: center;
        overflow: hidden;
        pointer-events: none;
      }
      .init-shine-beam {
        position: absolute;
        top: -50%;
        bottom: -50%;
        width: 45%;
        left: -60%;
        background: linear-gradient(
          115deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 245, 210, 0.25) 35%,
          rgba(255, 255, 255, 0.85) 50%,
          rgba(255, 245, 210, 0.25) 65%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: gold-shine-sweep 2.2s cubic-bezier(0.25, 0.9, 0.35, 1) infinite;
      }
      .init-sparkle {
        position: absolute;
        top: 3px;
        right: 14px;
        width: 16px;
        height: 16px;
        pointer-events: none;
        animation: star-sparkle-burst 2.2s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-[#FAF6EE] text-[#4B5149] antialiased selection:bg-[#163E26] selection:text-[#FAF6EE]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #FAF6EE; padding: 1.5rem; text-align: center;">
        <div style="position: absolute; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(201, 164, 92, 0.22) 0%, rgba(201, 164, 92, 0.06) 45%, transparent 70%); pointer-events: none;"></div>
        <div class="init-loader-stage">
          <div class="init-orbit-ring">
            <div class="init-orbit-jewel"></div>
          </div>
          <div class="init-emblem-wrapper">
            <img src="/greenwood-3d-gold-logo.png" alt="Greenwood" style="width: 100%; height: 100%; object-fit: contain;" />
            <div class="init-shine-mask">
              <div class="init-shine-beam"></div>
            </div>
            <div class="init-sparkle">
              <svg viewBox="0 0 24 24" fill="#FFFFFF" style="width: 100%; height: 100%; filter: drop-shadow(0 0 4px #FFD700) drop-shadow(0 0 8px #FFF);">
                <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" />
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
